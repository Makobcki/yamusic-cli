[package]
name = "yamusic-cli"
version = "0.1.0"
edition = "2021"
authors = ["frosty"]
description = "Lightweight daemon and CLI client for Yandex Music with MPRIS support"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }
mpris-server = { version = "0.10", features = ["tokio"] }
clap = { version = "4.5", features = ["derive"] }
md-5 = "0.10"
hex = "0.4"
dirs = "6.0"
toml = "0.8"
chrono = "0.4"
rand = "0.8"
colored = "3.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[dependencies.mimalloc]
version = "0.1"
default-features = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
